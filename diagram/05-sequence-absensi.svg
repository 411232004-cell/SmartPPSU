<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1050" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#334155"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#2563eb"/>
    </marker>
    <style>
      .head{fill:#eff6ff;stroke:#2563eb;stroke-width:1.5}
      .ht{font-size:12.5px;font-weight:bold;fill:#0f172a;text-anchor:middle}
      .life{stroke:#94a3b8;stroke-width:1.2;stroke-dasharray:5,4}
      .msg{stroke:#334155;stroke-width:1.5}
      .ret{stroke:#2563eb;stroke-width:1.3;stroke-dasharray:5,4}
      .m{font-size:11.5px;fill:#0f172a}
      .note{fill:#fffbeb;stroke:#eab308;stroke-width:1.2}
      .nt{font-size:10.5px;fill:#713f12}
      .act{fill:#e2e8f0;stroke:#64748b}
    </style>
  </defs>
  <rect width="1200" height="1050" fill="#f8fafc"/>
  <text x="600" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Sequence Diagram — Absensi Anti-Manipulasi</text>

  <!-- lifeline heads -->
  <g>
    <rect x="70" y="60" width="150" height="44" rx="8" class="head"/><text x="145" y="86" class="ht">Petugas PPSU</text>
    <rect x="270" y="60" width="170" height="44" rx="8" class="head"/><text x="355" y="80" class="ht">PWA (client</text><text x="355" y="95" class="ht">Next.js di HP)</text>
    <rect x="490" y="60" width="170" height="44" rx="8" class="head"/><text x="575" y="80" class="ht">API Next.js</text><text x="575" y="95" class="ht">(server / Vercel)</text>
    <rect x="710" y="60" width="170" height="44" rx="8" class="head"/><text x="795" y="80" class="ht">Firebase</text><text x="795" y="95" class="ht">Auth + Firestore</text>
    <rect x="930" y="60" width="170" height="44" rx="8" class="head"/><text x="1015" y="80" class="ht">Supabase</text><text x="1015" y="95" class="ht">Storage (foto)</text>
  </g>

  <!-- lifelines -->
  <line x1="145" y1="104" x2="145" y2="1020" class="life"/>
  <line x1="355" y1="104" x2="355" y2="1020" class="life"/>
  <line x1="575" y1="104" x2="575" y2="1020" class="life"/>
  <line x1="795" y1="104" x2="795" y2="1020" class="life"/>
  <line x1="1015" y1="104" x2="1015" y2="1020" class="life"/>

  <!-- 1 login -->
  <line x1="145" y1="140" x2="355" y2="140" class="msg" marker-end="url(#arr)"/>
  <text x="250" y="132" class="m" text-anchor="middle">1. login(email, password)</text>

  <line x1="355" y1="172" x2="795" y2="172" class="msg" marker-end="url(#arr)"/>
  <text x="575" y="164" class="m" text-anchor="middle">2. verifikasi kredensial + peran</text>

  <line x1="795" y1="204" x2="355" y2="204" class="ret" marker-end="url(#arrR)"/>
  <text x="575" y="196" class="m" text-anchor="middle" fill="#2563eb">3. sesi + data zona &amp; penugasan hari ini</text>

  <!-- camera -->
  <line x1="145" y1="250" x2="355" y2="250" class="msg" marker-end="url(#arr)"/>
  <text x="250" y="242" class="m" text-anchor="middle">4. tekan "Absen Masuk"</text>

  <rect x="347" y="262" width="16" height="120" class="act"/>
  <text x="372" y="290" class="m">5. buka kamera live (getUserMedia)</text>
  <text x="372" y="308" class="m">6. minta izin &amp; ambil koordinat GPS (Geolocation API)</text>

  <line x1="355" y1="360" x2="795" y2="360" class="msg" marker-end="url(#arr)"/>
  <text x="575" y="352" class="m" text-anchor="middle">7. minta waktu server (time mark server)</text>

  <line x1="795" y1="392" x2="355" y2="392" class="ret" marker-end="url(#arrR)"/>
  <text x="575" y="384" class="m" text-anchor="middle" fill="#2563eb">8. waktu server — bukan jam HP</text>

  <!-- capture -->
  <line x1="145" y1="438" x2="355" y2="438" class="msg" marker-end="url(#arr)"/>
  <text x="250" y="430" class="m" text-anchor="middle">9. ambil foto selfie (tidak bisa pilih dari galeri)</text>

  <rect x="347" y="450" width="16" height="130" class="act"/>
  <text x="372" y="476" class="m">10. resize foto (±1280px, ±300KB) di canvas</text>
  <text x="372" y="494" class="m">11. bakar watermark ke pixel: waktu server + koordinat + nama</text>
  <text x="372" y="512" class="m">12. hitung hash SHA-256 dari file hasil</text>

  <!-- validate -->
  <line x1="355" y1="620" x2="575" y2="620" class="msg" marker-end="url(#arr)"/>
  <text x="465" y="612" class="m" text-anchor="middle">13. kirim: foto + GPS + hash + id zona/tugas</text>

  <rect x="567" y="632" width="16" height="200" class="act"/>
  <text x="592" y="656" class="m">14. validasi geofence: jarak GPS ke titik zona ≤ radius?</text>
  <text x="592" y="674" class="m">15. validasi urutan progres &amp; duplikasi absensi hari ini</text>
  <text x="592" y="692" class="m" fill="#b91c1c">    jika gagal → tolak, catat percobaan mencurigakan</text>

  <line x1="575" y1="740" x2="1015" y2="740" class="msg" marker-end="url(#arr)"/>
  <text x="795" y="732" class="m" text-anchor="middle">16. upload foto ke bucket (immutable, tanpa hak hapus)</text>

  <line x1="1015" y1="772" x2="575" y2="772" class="ret" marker-end="url(#arrR)"/>
  <text x="795" y="764" class="m" text-anchor="middle" fill="#2563eb">17. URL foto tersimpan</text>

  <line x1="575" y1="816" x2="795" y2="816" class="msg" marker-end="url(#arr)"/>
  <text x="685" y="808" class="m" text-anchor="middle">18. simpan dokumen absensi: id petugas, zona, waktu server,</text>
  <text x="685" y="828" class="m" text-anchor="middle" font-size="10.5">koordinat, URL foto, hash, status validasi</text>

  <line x1="795" y1="868" x2="355" y2="868" class="ret" marker-end="url(#arrR)"/>
  <text x="575" y="860" class="m" text-anchor="middle" fill="#2563eb">19. konfirmasi absensi sah</text>

  <line x1="355" y1="900" x2="145" y2="900" class="ret" marker-end="url(#arrR)"/>
  <text x="250" y="892" class="m" text-anchor="middle" fill="#2563eb">20. tampilkan bukti absensi (foto + waktu + lokasi)</text>

  <!-- note realtime -->
  <rect x="640" y="930" width="520" height="92" rx="8" class="note"/>
  <text x="652" y="950" class="nt">Catatan: dokumen absensi baru di Firestore otomatis muncul real-time di dashboard monitoring Kasi Ekbang</text>
  <text x="652" y="966" class="nt">(listener Firestore). Integritas foto dapat diverifikasi ulang kapan pun dengan mencocokkan hash SHA-256.</text>
  <text x="652" y="982" class="nt">Alur yang sama dipakai untuk absen istirahat (mulai &amp; selesai), absen pulang,</text>
  <text x="652" y="998" class="nt">dan foto progres 0% / 50% / 100% (dengan tambahan id penugasan).</text>
</svg>
