<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 1000" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .tbl{fill:#fff;stroke:#334155;stroke-width:1.5}
      .th{fill:#1e40af}
      .tht{font-size:13px;font-weight:bold;fill:#fff;text-anchor:middle}
      .f{font-size:11px;fill:#0f172a}
      .pk{font-size:11px;font-weight:bold;fill:#b91c1c}
      .fk{font-size:11px;fill:#1d4ed8}
      .rel{stroke:#64748b;stroke-width:1.4;fill:none}
      .card{font-size:10px;fill:#475569}
      .note{fill:#fffbeb;stroke:#eab308}
      .nt{font-size:11px;fill:#713f12}
    </style>
  </defs>
  <rect width="1250" height="1000" fill="#f8fafc"/>
  <text x="625" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">ERD / Struktur Database — Firestore (data teks) + Supabase Storage (foto)</text>

  <!-- users -->
  <g>
    <rect x="60" y="70" width="290" height="150" class="tbl"/>
    <rect x="60" y="70" width="290" height="26" class="th" rx="6"/>
    <text x="205" y="87" class="tht">users (koleksi)</text>
    <text x="70" y="114" class="pk">id (uid Firebase Auth)</text>
    <text x="70" y="132" class="f">nama, nip/niap, email</text>
    <text x="70" y="150" class="f">peran: petugas_ppsu | kasi_ekbang</text>
    <text x="70" y="168" class="f">zona_id → zona</text>
    <text x="70" y="186" class="f">aktif: boolean</text>
    <text x="70" y="204" class="f">dibuat_pada: time mark</text>
  </g>

  <!-- zona -->
  <g>
    <rect x="480" y="70" width="290" height="130" class="tbl"/>
    <rect x="480" y="70" width="290" height="26" class="th" rx="6"/>
    <text x="625" y="87" class="tht">zona</text>
    <text x="490" y="114" class="pk">id</text>
    <text x="490" y="132" class="f">nama_zona, alamat/wilayah</text>
    <text x="490" y="150" class="f">titik_pusat: {lat, lng}</text>
    <text x="490" y="168" class="f">radius_meter: number (geofence)</text>
    <text x="490" y="186" class="f">jadwal_kerja: {jam_masuk, jam_pulang}</text>
  </g>

  <!-- penugasan -->
  <g>
    <rect x="880" y="70" width="310" height="168" class="tbl"/>
    <rect x="880" y="70" width="310" height="26" class="th" rx="6"/>
    <text x="1035" y="87" class="tht">penugasan</text>
    <text x="890" y="114" class="pk">id</text>
    <text x="890" y="132" class="fk">petugas_id → users, zona_id → zona</text>
    <text x="890" y="150" class="f">jenis_pekerjaan, deskripsi, prioritas</text>
    <text x="890" y="168" class="f">tanggal_tugas, target_selesai</text>
    <text x="890" y="186" class="f">status: ditugaskan | proses | selesai | tertunda</text>
    <text x="890" y="204" class="f">alasan_penundaan (jika tertunda)</text>
    <text x="890" y="222" class="fk">dibuat_oleh → users (Kasi Ekbang)</text>
  </g>

  <!-- absensi -->
  <g>
    <rect x="60" y="330" width="290" height="205" class="tbl"/>
    <rect x="60" y="330" width="290" height="26" class="th" rx="6"/>
    <text x="205" y="347" class="tht">absensi</text>
    <text x="70" y="374" class="pk">id</text>
    <text x="70" y="392" class="fk">petugas_id → users, zona_id → zona</text>
    <text x="70" y="410" class="f">jenis: masuk | istirahat_mulai |</text>
    <text x="70" y="428" class="f">       istirahat_selesai | pulang</text>
    <text x="70" y="446" class="f">waktu_server: time mark (anti-manipulasi)</text>
    <text x="70" y="464" class="f">koordinat: {lat, lng, akurasi}</text>
    <text x="70" y="482" class="f">foto_url (Supabase), foto_hash_sha256</text>
    <text x="70" y="500" class="f">dalam_zona: boolean, jarak_meter</text>
    <text x="70" y="518" class="f">status: sah | ditolak | mencurigakan</text>
  </g>

  <!-- progres_foto -->
  <g>
    <rect x="480" y="310" width="290" height="185" class="tbl"/>
    <rect x="480" y="310" width="290" height="26" class="th" rx="6"/>
    <text x="625" y="327" class="tht">progres_foto</text>
    <text x="490" y="354" class="pk">id</text>
    <text x="490" y="372" class="fk">penugasan_id → penugasan</text>
    <text x="490" y="390" class="fk">petugas_id → users</text>
    <text x="490" y="408" class="f">tahap: 0% | 50% | 100%</text>
    <text x="490" y="426" class="f">waktu_server, koordinat {lat,lng}</text>
    <text x="490" y="444" class="f">foto_url, foto_hash_sha256</text>
    <text x="490" y="462" class="f">dalam_zona: boolean</text>
    <text x="490" y="480" class="f">keterangan</text>
  </g>

  <!-- laporan_kendala -->
  <g>
    <rect x="880" y="310" width="310" height="130" class="tbl"/>
    <rect x="880" y="310" width="310" height="26" class="th" rx="6"/>
    <text x="1035" y="327" class="tht">laporan_kendala</text>
    <text x="890" y="354" class="pk">id</text>
    <text x="890" y="372" class="fk">petugas_id → users, penugasan_id (opsional)</text>
    <text x="890" y="390" class="f">jenis: kondisi_berbahaya | alat_rusak | kendala</text>
    <text x="890" y="408" class="f">deskripsi, waktu_server, koordinat</text>
    <text x="890" y="426" class="f">foto_url (opsional)</text>
  </g>

  <!-- penilaian -->
  <g>
    <rect x="60" y="600" width="290" height="200" class="tbl"/>
    <rect x="60" y="600" width="290" height="26" class="th" rx="6"/>
    <text x="205" y="617" class="tht">penilaian</text>
    <text x="70" y="644" class="pk">id</text>
    <text x="70" y="662" class="fk">petugas_id → users</text>
    <text x="70" y="680" class="fk">penilai_id → users (Kasi Ekbang)</text>
    <text x="70" y="698" class="f">periode: 12 bulan, mis. "2026"</text>
    <text x="70" y="716" class="f">skor: {c1i1..c5i5: 1-5 | "tidak_dinilai"}</text>
    <text x="70" y="734" class="f">alasan_tidak_dinilai: {...}</text>
    <text x="70" y="752" class="f">catatan_penilai</text>
    <text x="70" y="770" class="f">status: draft | final</text>
    <text x="70" y="788" class="f">diklarifikasi: boolean, riwayat_koreksi</text>
  </g>

  <!-- nilai_akhir -->
  <g>
    <rect x="480" y="600" width="290" height="200" class="tbl"/>
    <rect x="480" y="600" width="290" height="26" class="th" rx="6"/>
    <text x="625" y="617" class="tht">nilai_akhir (hasil SMART)</text>
    <text x="490" y="644" class="pk">id = petugas_id + periode</text>
    <text x="490" y="662" class="fk">penilaian_id → penilaian</text>
    <text x="490" y="680" class="f">nilai_kriteria: {c1..c5: 1.0-5.0}</text>
    <text x="490" y="698" class="f">bobot: {c1:0.15, c2:0.25, c3:0.25,</text>
    <text x="490" y="714" class="f">        c4:0.15, c5:0.20}</text>
    <text x="490" y="732" class="f">utilitas: {c1..c5: 0-1}</text>
    <text x="490" y="750" class="f">nilai_akhir: 0-100</text>
    <text x="490" y="768" class="f">peringkat: number (per periode)</text>
    <text x="490" y="786" class="f">dihitung_pada: time mark</text>
  </g>

  <!-- rekap_bulanan -->
  <g>
    <rect x="880" y="600" width="310" height="170" class="tbl"/>
    <rect x="880" y="600" width="310" height="26" class="th" rx="6"/>
    <text x="1035" y="617" class="tht">rekap_periode (monev, otomatis)</text>
    <text x="890" y="644" class="pk">id = petugas_id + periode</text>
    <text x="890" y="662" class="f">hadir, izin, alpha, terlambat (dari absensi)</text>
    <text x="890" y="680" class="f">tugas_selesai, tertunda, tepat_waktu</text>
    <text x="890" y="698" class="f">foto_lengkap: 0/50/100% per tugas</text>
    <text x="890" y="716" class="f">laporan_kendala_count</text>
    <text x="890" y="734" class="f">nilai_akhir, peringkat (dari nilai_akhir)</text>
    <text x="890" y="752" class="f">→ siap export PDF/Excel tanpa hitung manual</text>
  </g>

  <!-- relationships -->
  <path d="M350 145 L480 135" class="rel"/><text x="365" y="132" class="card">n : 1</text>
  <path d="M770 140 L880 130" class="rel"/><text x="800" y="122" class="card">1 : n</text>
  <path d="M205 220 L205 330" class="rel"/><text x="212" y="280" class="card">1 : n</text>
  <path d="M350 400 L480 400" class="rel"/><text x="358" y="392" class="card">per petugas</text>
  <path d="M1035 238 L1035 310" class="rel"/><text x="1042" y="280" class="card">1 : n</text>
  <path d="M770 402 L880 380" class="rel"/>
  <path d="M205 535 L205 600" class="rel"/><text x="212" y="562" class="card">absensi → bukti C1</text>
  <path d="M350 700 L480 700" class="rel"/><text x="360" y="692" class="card">1 : 1 per periode</text>
  <path d="M770 700 L880 690" class="rel"/><text x="790" y="688" class="card">1 : 1</text>

  <!-- note supabase -->
  <rect x="60" y="850" width="1130" height="132" rx="10" class="note"/>
  <text x="80" y="876" class="nt" font-weight="bold" font-size="13">Catatan penyimpanan foto (Supabase Storage, bukan di Firestore):</text>
  <text x="80" y="898" class="nt">• Struktur bucket: foto-ppsu/{periode}/{petugas_id}/{jenis}_{time-mark}.jpg</text>
  <text x="80" y="916" class="nt">  jenis: absen_masuk, absen_istirahat_mulai, absen_istirahat_selesai, absen_pulang, progres_0, progres_50, progres_100</text>
  <text x="80" y="934" class="nt">• Foto sudah di-resize di HP petugas sebelum upload (maks ±1280px, ±300KB) → hemat kuota &amp; cepat di zona dengan sinyal lemah</text>
  <text x="80" y="952" class="nt">• Kebijakan akses: petugas hanya bisa upload (insert), tidak bisa update/delete; Kasi Ekbang punya akses CRUD penuh</text>
  <text x="80" y="970" class="nt">• Di Firestore hanya disimpan: foto_url + foto_hash_sha256 + metadata (waktu server, koordinat, status validasi) → verifikasi integritas kapan pun</text>
</svg>
